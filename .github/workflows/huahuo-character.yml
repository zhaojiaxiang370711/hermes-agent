name: Huahuo character contracts

on:
  push:
    branches: [codex/huahuo-character-runtime]
    paths:
      - 'huahuo_character/**'
      - 'tests/huahuo_character/**'
      - '.github/workflows/huahuo-character.yml'
  pull_request:
    paths:
      - 'huahuo_character/**'
      - 'tests/huahuo_character/**'
      - '.github/workflows/huahuo-character.yml'

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare independent contract test interpreter
        run: |
          python -m venv .huahuo-test-venv
          .huahuo-test-venv/bin/python -m pip install pytest==9.0.2
      - name: Run character contracts with Hermes wrapper
        env:
          HERMES_PYTHON: ${{ github.workspace }}/.huahuo-test-venv/bin/python
        run: scripts/run_tests.sh tests/huahuo_character -j 2 -- -c huahuo_character/pytest.ini --confcutdir="$PWD/tests/huahuo_character" -q
